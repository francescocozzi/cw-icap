# CW decoder - configuration (copy to the apps folder on the SD card, next to CW.APP)
# pitch: 0 = automatic search 300-1300 Hz; otherwise set the radio's CW PITCH
pitch=0
# detection filter bandwidth in Hz (60-150; narrower = more sensitive, less tolerant of drift)
bw=80
# starting speed (adapts by itself)
wpm=20
# minimum SNR in dB in the filter band to open the decoder
squelch=12
# text on the DECODE screen: word = each word as soon as it is complete (nearly real time),
# line = whole lines "HHMM WPM Hz : TEXT" (shown only when the line is closed)
out=word
