# CW decoder - configurazione (copiare nella cartella delle app sulla SD, accanto a CW.APP)
# pitch: 0 = ricerca automatica 300-1300 Hz; altrimenti metti il CW PITCH della radio
pitch=0
# banda del filtro di rivelazione in Hz (60-150; più stretta = più sensibile, meno tollerante alla deriva)
bw=80
# velocità di partenza (si adatta da sola)
wpm=20
# SNR minimo in dB nella banda del filtro per aprire il decoder
squelch=12
